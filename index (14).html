<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى سوهاج العام - قسم النساء و التوليد</title>
    
    <!-- Importing a Google Font for professional Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Medical Blue Theme */
            --primary-color: #0288d1; 
            --primary-dark: #01579b;
            --accent-color: #e1f5fe;
            --text-color: #333333;
            --text-light: #666666;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Mobile Container Simulator */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Header Section */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 18px 16px 16px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(2, 136, 209, 0.3);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .hospital-logo {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .hospital-logo svg {
            width: 70%; 
            height: 70%;
            fill: white;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: 0.82rem;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Main Content Area */
        main {
            flex: 1;
            padding: 12px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Grid for Buttons */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Button Styles */
        .menu-btn {
            background-color: var(--card-bg);
            border: none;
            border-radius: 14px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 0.85;
            min-height: 0;
        }

        .menu-btn:active {
            transform: scale(0.96);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .menu-btn.external {
            background-color: #ffffff;
            border: 1px solid rgba(2, 136, 209, 0.2);
        }

        .menu-btn.secondary {
            background-color: var(--accent-color);
            color: var(--primary-dark);
        }

        .icon-container {
            width: 40px;
            height: 40px;
            background-color: #f0f4f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            transition: background 0.3s;
        }

        .menu-btn.external .icon-container {
            background-color: rgba(2, 136, 209, 0.1);
            color: var(--primary-color);
        }

        .menu-btn.secondary .icon-container {
            background-color: rgba(2, 136, 209, 0.15);
        }

        .icon-container svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-text {
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 8px 16px 14px;
            font-size: 0.72rem;
            color: var(--text-light);
            margin-top: auto;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .modal p {
            color: var(--text-light);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .close-modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-modal-btn:hover {
            background: var(--primary-dark);
        }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="hospital-logo">
                <!-- HEADER ICON: Complex Custom Path -->
                <svg viewBox="0 0 120 80">
                    <path d="M 60 5 A 45 45 0 1 0 100 55 A 38 38 0 1 1 60 5 Z M 43 64 H 76 V 29 H 63 V 37 H 56 V 29 H 43 Z M 47 37 H 51 V 44 H 47 Z M 68 37 H 72 V 44 H 68 Z M 47 51 H 51 V 58 H 47 Z M 68 51 H 72 V 58 H 68 Z M 55 51 H 62 V 64 H 55 Z" />
                </svg>
            </div>
            <h1>مستشفى سوهاج العام</h1>
            <p class="subtitle">قسم النساء و التوليد</p>
        </header>

        <main>
            <div class="menu-grid">
                <!-- الحالات -->
                <a href="https://ham9y.github.io/Form-Filter/" class="menu-btn external" target="_self">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 2H15C15.5523 2 16 2.44772 16 3V5H20C20.5523 5 21 5.44772 21 6V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V6C3 5.44772 3.44772 5 4 5H8V3C8 2.44772 8.44772 2 9 2ZM10 5H14V4H10V5ZM8 10H16V12H8V10ZM8 14H14V16H8V14Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">الحالات</span>
                </a>

                <!-- الأطباء -->
                <a href="https://ham9y.github.io/Doctors/" class="menu-btn external" target="_self">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 10C14.2091 10 16 8.20914 16 6C16 3.79086 14.2091 2 12 2C9.79086 2 8 3.79086 8 6C8 8.20914 9.79086 10 12 10ZM21 21C21 16.5817 17.4183 13 13 13H11C6.58172 13 3 16.5817 3 21H5C5 17.6863 7.68629 15 11 15H13C16.3137 15 19 17.6863 19 21H21Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">الأطباء</span>
                </a>

                <!-- الممرضات -->
                <a href="https://ham9y.github.io/Nurses/" class="menu-btn external" target="_self">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12ZM4 20C4 16.6863 6.68629 14 10 14H14C17.3137 14 20 16.6863 20 20V21H4V20Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">الممرضات</span>
                </a>

                <!-- الأجهزة -->
                <button class="menu-btn secondary" onclick="openUnavailableModal('الأجهزة')">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 4C5 2.89543 5.89543 2 7 2H17C18.1046 2 19 2.89543 19 4V15C19 16.1046 18.1046 17 17 17H13V19H15V21H9V19H11V17H7C5.89543 17 5 16.1046 5 15V4ZM7 4V15H17V4H7Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">الأجهزة</span>
                </button>

                <!-- دفاتر التمريض -->
                <button class="menu-btn secondary" onclick="openUnavailableModal('دفاتر التمريض')">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 2H18C19.1046 2 20 2.89543 20 4V20C20 21.1046 19.1046 22 18 22H6C4.89543 22 4 21.1046 4 20V4C4 2.89543 4.89543 2 6 2ZM8 6H16V8H8V6ZM8 10H16V12H8V10ZM8 14H13V16H8V14Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">دفاتر التمريض</span>
                </button>

                <!-- الإنجاز اليومي -->
                <a href="https://ham9y.github.io/Daily-Stats/" class="menu-btn external" target="_self">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 13H5V19H3V13ZM8 9H10V19H8V9ZM13 5H15V19H13V5ZM18 11H20V19H18V11Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">الإنجاز اليومي</span>
                </a>

                <!-- بيان تنظيم الأسرة -->
                <a href="https://ham9y.github.io/Statement-report/" class="menu-btn external" target="_self">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C10.3431 2 9 3.34315 9 5C9 6.65685 10.3431 8 12 8C13.6569 8 15 6.65685 15 5C15 3.34315 13.6569 2 12 2ZM16.5 13C17.3284 13 18 12.3284 18 11.5C18 10.6716 17.3284 10 16.5 10H7.5C6.67157 10 6 10.6716 6 11.5C6 12.3284 6.67157 13 7.5 13H9V18H7V20H17V18H15V13H16.5Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">بيان تنظيم الأسرة</span>
                </a>

                <!-- تقرير المديرية -->
                <button class="menu-btn secondary" onclick="openUnavailableModal('تقرير المديرية')">
                    <div class="icon-container">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 3H17C18.1046 3 19 3.89543 19 5V19C19 20.1046 18.1046 21 17 21H7C5.89543 21 5 20.1046 5 19V5C5 3.89543 5.89543 3 7 3ZM7 5V19H17V5H7ZM9 8H15V10H9V8ZM9 12H15V14H9V12Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">تقرير المديرية</span>
                </button>
            </div>
        </main>

        <footer>وفقنا الله وإياكم</footer>
    </div>

    <div class="modal-overlay" id="unavailableModal" onclick="closeModal('unavailableModal')">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="hospital-logo" style="width: 60px; height: 60px; margin: 0 auto 15px; background-color: var(--bg-color); color: var(--primary-color);">
                <svg viewBox="0 0 24 24" style="fill: var(--primary-color); width: 30px; height: 30px;">
                    <path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"/>
                </svg>
            </div>
            <h3 id="unavailableTitle">الخدمة</h3>
            <p>هذه الخدمة غير متاحة حالياً.</p>
            <button class="close-modal-btn" onclick="closeModal('unavailableModal')">حسناً</button>
        </div>
    </div>

    <script>
        function openUnavailableModal(serviceName) {
            document.getElementById('unavailableTitle').textContent = serviceName;
            document.getElementById('unavailableModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
    </script>
</body>
</html>

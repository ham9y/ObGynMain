<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى سوهاج العام - قسم النساء و التوليد</title>
    
    <!-- Importing a Google Font for professional Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Updated Color Palette: Medical Blue Theme */
            --primary-color: #0288d1; /* Light Blue */
            --primary-dark: #01579b;  /* Deep Blue */
            --accent-color: #e1f5fe;  /* Very Light Blue Background */
            --text-color: #333333;
            --text-light: #666666;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Mobile Container Simulator */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Header Section */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 40px 24px 30px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(2, 136, 209, 0.3);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .hospital-logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .hospital-logo svg {
            width: 45px;
            height: 45px;
            fill: white;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Main Content Area */
        main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Grid for Buttons */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Button Styles */
        .menu-btn {
            background-color: var(--card-bg);
            border: none;
            border-radius: var(--border-radius);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
        }

        .menu-btn:active {
            transform: scale(0.96);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .menu-btn.external {
            background-color: #ffffff;
            border: 1px solid rgba(2, 136, 209, 0.2);
        }

        .menu-btn.secondary {
            background-color: var(--accent-color);
            color: var(--primary-dark);
        }

        .icon-container {
            width: 56px;
            height: 56px;
            background-color: #f0f4f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            transition: background 0.3s;
        }

        .menu-btn.external .icon-container {
            background-color: rgba(2, 136, 209, 0.1);
            color: var(--primary-color);
        }

        .menu-btn.secondary .icon-container {
            background-color: rgba(2, 136, 209, 0.15);
        }

        .icon-container svg {
            width: 28px;
            height: 28px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-text {
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: auto;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .modal p {
            color: var(--text-light);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .close-modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-modal-btn:hover {
            background: var(--primary-dark);
        }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="hospital-logo">
                <!-- Updated Hospital Icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3ZM10 17H8V13H4V11H8V7H10V11H14V13H10V17ZM16 17H14V13H16V17Z"/>
                </svg>
            </div>
            <h1>مستشفى سوهاج العام</h1>
            <p class="subtitle">قسم النساء و التوليد</p>
        </header>

        <main>
            <div class="menu-grid">
                <!-- 1st Button: الحالات -->
                <a href="https://ham9y.github.io/Form-Filter/" class="menu-btn external" target="_self">
                    <div class="icon-container">
                        <!-- Icon: Clipboard List (Forms/Cases) -->
                        <svg viewBox="0 0 24 24">
                            <path d="M9 2H15C15.5523 2 16 2.44772 16 3V5H20C20.5523 5 21 5.44772 21 6V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V6C3 5.44772 3.44772 5 4 5H8V3C8 2.44772 8.44772 2 9 2ZM10 5H14V4H10V5ZM8 10H16V12H8V10ZM8 14H14V16H8V14Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">الحالات</span>
                </a>

                <!-- 2nd Button: الأطباء -->
                <a href="https://ham9y.github.io/Doctors/" class="menu-btn external" target="_self">
                    <div class="icon-container">
                        <!-- Icon: Doctor with Stethoscope -->
                        <svg viewBox="0 0 24 24">
                            <path d="M12 10C14.2091 10 16 8.20914 16 6C16 3.79086 14.2091 2 12 2C9.79086 2 8 3.79086 8 6C8 8.20914 9.79086 10 12 10ZM21 21C21 16.5817 17.4183 13 13 13H11C6.58172 13 3 16.5817 3 21H5C5 17.6863 7.68629 15 11 15H13C16.3137 15 19 17.6863 19 21H21Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">الأطباء</span>
                </a>

                <!-- 3rd Button: بيان تنظيم الأسرة -->
                <button class="menu-btn secondary" onclick="openModal('بيان تنظيم الأسرة')">
                    <div class="icon-container">
                        <!-- Icon: Pregnant Woman / Maternity -->
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C10.3431 2 9 3.34315 9 5C9 6.65685 10.3431 8 12 8C13.6569 8 15 6.65685 15 5C15 3.34315 13.6569 2 12 2ZM16.5 13C17.3284 13 18 12.3284 18 11.5C18 10.6716 17.3284 10 16.5 10H7.5C6.67157 10 6 10.6716 6 11.5C6 12.3284 6.67157 13 7.5 13H9V18H7V20H17V18H15V13H16.5Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">بيان تنظيم الأسرة</span>
                </button>

                <!-- 4th Button: تقرير المديرية -->
                <button class="menu-btn secondary" onclick="openModal('تقرير المديرية')">
                    <div class="icon-container">
                        <!-- Icon: Analytics Chart / Report -->
                        <svg viewBox="0 0 24 24">
                            <path d="M3 13H5V19H3V13ZM8 9H10V19H8V9ZM13 5H15V19H13V5ZM18 11H20V19H18V11Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="btn-text">تقرير المديرية</span>
                </button>
            </div>
        </main>

        <footer>
            &copy; 2023 مستشفى سوهاج العام
        </footer>
    </div>

    <!-- Simple Modal Interaction -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal">
            <div class="hospital-logo" style="width: 60px; height: 60px; margin: 0 auto 15px; background-color: var(--bg-color); color: var(--primary-color);">
                <svg viewBox="0 0 24 24" style="fill: var(--primary-color); width: 30px; height: 30px;">
                    <path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"/>
                </svg>
            </div>
            <h3 id="modalTitle">عنوان</h3>
            <p>هذه الخدمة متاحة حالياً للإطلاع الداخلي فقط.</p>
            <button class="close-modal-btn" onclick="closeModal()">حسناً</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('infoModal');
        const modalTitle = document.getElementById('modalTitle');

        function openModal(title) {
            modalTitle.textContent = title;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
